# GitHub Actions: Cleanup Preview Environment
# Version: v1.0 (2025-10-13)
#
# Triggers on PR close/merge
# - Deletes Neon database branch
# - Cleans up Vercel preview deployment

name: Cleanup Preview

on:
  pull_request:
    types: [closed]
    # NO base-branch filter, deliberately — and it must MATCH preview.yml (CC15).
    #
    # This is the teardown half of the same bug. `branches:` filters on the PR's
    # BASE, so a stacked pull request never reached this workflow either. While
    # preview.yml shared the filter that was merely symmetric dead weight: no
    # preview branch was created for a stacked PR, so none needed deleting.
    #
    # The moment preview.yml gates every PR, that stops being true — every
    # stacked PR gets a Neon branch, and leaving this filter in place would mean
    # none of them is ever deleted. The gating fix would itself have become a
    # silent leak of database branches.
    #
    # Teardown keys on github.event.pull_request.number and has no base-branch
    # dependency, so removing the filter changes nothing but reach. Keep these
    # two triggers in step: whatever creates preview resources must be matched
    # by whatever destroys them.

# The default GITHUB_TOKEN is read-only, so the "Comment PR" step's
# issues.createComment 403'd ("Resource not accessible by integration").
# Grant write so the run goes green (LSCMD-NEON-PRSWEEP-0618-dc).
permissions:
  contents: read
  pull-requests: write

env:
  NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
  NEON_API_KEY: ${{ secrets.NEON_API_KEY }}

jobs:
  cleanup:
    name: Delete Preview Resources
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Neon CLI
        run: |
          npm install -g neonctl
          neonctl --version

      - name: Delete Neon branch
        run: |
          chmod +x ./scripts/neon-branch-delete.sh
          ./scripts/neon-branch-delete.sh ${{ github.event.pull_request.number }}

      - name: Comment PR
        # Cosmetic only — a comment hiccup must never mark cleanup red or mask
        # the actual branch-delete result above.
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🗑️ **Preview Environment Cleaned Up**

              - Database branch \`pr-${{ github.event.pull_request.number }}\` has been deleted
              - Vercel preview deployment will be removed automatically

              All preview resources have been released.`
            })
